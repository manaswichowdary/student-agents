<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4EA">
<title>Student Agents by Freebie Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Freebie Radar look, from the team's Claude Design mockup: peach dotted ground, ink outlines with offset
   shadows, Fredoka for headings, Nunito for text, blue actions, yellow Freebie. One phone width column,
   with a side panel on wide screens. */
:root {
  --ground: #FFF4EA; --dot: #FFDCE6; --ink: #1E1A16; --muted: #5E574B; --muted2: #4A4337; --paper: #ffffff;
  --blue: #3366D6; --link: #2A5BC8; --blue-soft: #CFDDF5; --blue-pale: #EEF3FD; --yellow: #FFD25A; --yellow-soft: #FFF1C7;
  --pink: #FF5C8A; --pink-soft: #FFE3EC; --green: #8FD18B; --green-soft: #E3F5E1; --green-ink: #1F7A3A;
  --orange-ink: #B4410C; --line: #E6DCC8; --navbg: #FFFDF8; --red: #C2361B;
  --display: "Fredoka", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0; min-height: 100% }
body { background-color: var(--ground); background-image: radial-gradient(var(--dot) 3px, transparent 3px);
  background-size: 36px 36px; color: var(--ink); font: 700 16px/1.4 var(--body) }
a { color: var(--link); font-weight: 800 } a:hover { color: #1F49A8 }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance }
h1 { font-size: 34px; line-height: 1.08 }
h2 { font-size: 22px; line-height: 1.15 }
p { margin: 0 }
.muted { color: var(--muted) }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px }

.shell { max-width: 1440px; margin: 0 auto; min-height: 100vh;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) 120px max(20px, env(safe-area-inset-left, 0px)) }
.app { width: 100%; max-width: 520px; margin: 0 auto; min-width: 0 }
.topbar, .sidenav, .rail { display: none }
@media (min-width: 1100px) { body.in .mobile-only { display: none !important } }
@media (min-width: 1100px) {
  .shell.in { display: grid; grid-template-columns: 230px minmax(0, 1fr) 320px; gap: 28px; padding: 28px 32px 48px; align-items: start }
  .shell.in .app { max-width: none; margin: 0 }
  .shell.in .sidenav { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 24px }
  .shell.in .rail { display: flex; flex-direction: column; gap: 24px }
  body.in .topbar { display: block }
  body.in nav.tabbar { display: none !important }
  .feedgrid { display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px !important; align-items: start }
  .feedgrid > .wide { grid-column: 1 / -1 }
  .authcard { background: var(--paper); border: 3px solid var(--ink); border-radius: 32px; box-shadow: 8px 9px 0 var(--ink); padding: 40px }
}
@media (min-width: 1100px) and (max-width: 1280px) { .shell.in { grid-template-columns: 200px minmax(0, 1fr) } .shell.in .rail { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)) } }
.topbar { background: var(--navbg); border-bottom: 3px solid var(--ink) }
.topbar .in { max-width: 1440px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px }
.logo { width: 44px; height: 44px; border: 3px solid var(--ink); border-radius: 14px; background: var(--yellow); display: flex; align-items: center; justify-content: center; flex: none }
.sidenav a { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 16px; border: 3px solid transparent; color: var(--ink); text-decoration: none; font-size: 16px; font-weight: 800 }
.sidenav a:hover { background: var(--paper); border-color: var(--ink) }
.sidenav a[aria-current="page"] { background: var(--blue-soft); border-color: var(--ink); box-shadow: 0 4px 0 var(--ink) }
.rail section { background: var(--paper); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 5px 6px 0 var(--ink); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px }

/* the signed out hero: Freebie hops in on wide screens, finds float around */
.hero { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px }
.hero h1 { font-size: clamp(34px, 5vw, 60px); letter-spacing: -.5px; line-height: 1.04 }
.hero .lead { font-size: clamp(17px, 1.6vw, 20px); color: var(--muted); max-width: 620px }
.stage { position: relative; width: 300px; height: 250px; max-width: 100% }
.stage .blob { position: absolute; left: 20px; top: 40px; width: 260px; height: 200px; border-radius: 48% 52% 45% 55% / 55% 45% 55% 45%; background: var(--blue-soft) }
.stage .who { position: absolute; left: 60px; top: 10px }
.bubble { position: absolute; background: var(--pink-soft); border: 3px solid var(--ink); border-radius: 22px 22px 22px 8px; box-shadow: 0 4px 0 var(--ink);
  padding: 6px 14px; font-family: var(--display); font-size: 20px; white-space: nowrap; right: -6px; top: 0 }
.bubble2 { display: none }
.stickers { display: none }
.sticker { position: absolute; width: 220px; text-align: left; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 5px 6px 0 var(--ink); overflow: hidden }
.sticker b { display: block; padding: 7px 14px; border-bottom: 3px solid var(--ink); font-size: 13px }
.sticker span { display: block; padding: 10px 14px; font-family: var(--display); font-size: 18px }
.signform { width: 100%; max-width: 560px; text-align: left }
@media (min-width: 900px) {
  .stage { width: 520px; height: 340px }
  .stage .blob { left: 70px; top: 70px; width: 380px; height: 260px }
  .stage .who { left: 165px; top: 40px }
  .bubble { left: 340px; right: auto; font-size: 26px; padding: 10px 20px }
  .bubble2 { display: block; position: absolute; left: 360px; top: 74px; width: 230px; text-align: left; background: var(--paper); border: 3px solid var(--ink);
    border-radius: 8px 26px 26px 26px; box-shadow: 0 5px 0 var(--ink); padding: 12px 16px; font-size: 16px; font-weight: 800; line-height: 1.35 }
  .signform { background: var(--paper); border: 3px solid var(--ink); border-radius: 28px; box-shadow: 6px 7px 0 var(--ink); padding: 20px 22px }
  .signform .row { flex-wrap: wrap } .signform .input { flex: 1 1 260px }
  .shell.out .app { max-width: 1100px }
}
@media (min-width: 1240px) { .stickers { display: block } }

/* motion: things rise in when a screen opens, Freebie bobs, buttons lift on hover */
@keyframes rise { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: none } }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
@keyframes pop { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: none } }
@keyframes hopx { from { transform: translateX(-900px) } to { transform: none } }
@keyframes hopy { 0% { transform: translateY(0) } 16% { transform: translateY(-160px) rotate(-10deg) } 33% { transform: translateY(0) scale(1.08, .9) }
  50% { transform: translateY(-110px) rotate(-6deg) } 66% { transform: translateY(0) scale(1.06, .92) } 83% { transform: translateY(-50px) } 100% { transform: translateY(0) } }
@keyframes wave { from { transform: rotate(-14deg) } to { transform: rotate(24deg) } }
.anim > .stack > *, .anim .feedgrid > * { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both }
.anim > .stack > *:nth-child(2), .anim .feedgrid > *:nth-child(2) { animation-delay: .08s } .anim > .stack > *:nth-child(3), .anim .feedgrid > *:nth-child(3) { animation-delay: .16s }
.anim > .stack > *:nth-child(4), .anim .feedgrid > *:nth-child(4) { animation-delay: .24s } .anim > .stack > *:nth-child(5), .anim .feedgrid > *:nth-child(5) { animation-delay: .32s }
.anim > .stack > *:nth-child(n+6), .anim .feedgrid > *:nth-child(n+6) { animation-delay: .4s }
.mascot { animation: bob 1.4s ease-in-out infinite }
.pop { animation: pop .55s cubic-bezier(.3, 1.6, .5, 1) both }
@media (min-width: 900px) { .hopx { animation: hopx 1.8s cubic-bezier(.3, .6, .4, 1) .2s both } .hopy { animation: hopy 1.8s linear .2s both } .hopx .mascot { animation-delay: 2s } }
.btn { transition: transform .15s ease } .btn:hover { transform: translateY(-2px) }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.stack > *, .row > * { min-width: 0 }
.row > .btn, .row > .chip, .row > .avatar, .row > .status { flex: none }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.between { justify-content: space-between }

.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 18px; line-height: 1 }
.brand small { display: block; font-family: var(--body); font-size: 12px; font-weight: 800; color: var(--muted); margin-top: 2px }
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 5px 6px 0 var(--ink); padding: 16px;
  display: flex; flex-direction: column; gap: 8px; min-width: 0; overflow-wrap: anywhere }
.card.urgent { background: var(--pink-soft); padding: 0; overflow: hidden }
.card.urgent .band { display: flex; align-items: center; gap: 8px; padding: 9px 16px; background: var(--pink); border-bottom: 3px solid var(--ink); font-size: 14px; font-weight: 800 }
.card.urgent .inner { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px }
.chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 2px solid var(--ink);
  border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; white-space: nowrap }
.chip.study { background: var(--green-soft) } .chip.opportunity { background: var(--yellow-soft) } .chip.scholarship { background: #E5ECFB }
.chip.food, .chip.event { background: var(--paper) } .chip.ok { background: var(--green) } .chip.bad { background: #FFC9BD }
.chip.warn { background: var(--yellow) } .chip.blue { background: var(--blue-soft) }
.meta { font-size: 15px; color: var(--muted2) }
.money { font-family: var(--display); font-size: 19px; color: var(--green-ink) }
.why { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted2) }

.btn { min-height: 52px; padding: 0 22px; border: 3px solid var(--ink); border-radius: 999px; background: var(--blue); color: #fff;
  font-family: var(--display); font-size: 19px; font-weight: 700; box-shadow: 0 5px 0 var(--ink); cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink) }
.btn.small { min-height: 44px; padding: 0 18px; font-size: 16px; box-shadow: 0 3px 0 var(--ink) }
.btn.white { background: var(--paper); color: var(--ink) }
.btn.danger { background: var(--paper); color: var(--red) }
.btn.block { width: 100% }
.btn:disabled { opacity: .55; cursor: default; transform: none }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); font-weight: 800; font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px }

label.lbl { font-size: 15px; font-weight: 800 }
.input, select.input, textarea.input { width: 100%; min-height: 54px; border: 3px solid var(--ink); border-radius: 16px; background: var(--paper);
  padding: 0 16px; font-size: 17px; font-weight: 700 }
textarea.input { padding: 12px 16px }
.code { letter-spacing: .5em; text-align: center; font-family: var(--display); font-size: 30px; padding-left: .5em }
.hint { font-size: 14px; color: var(--muted) }
.err { color: var(--red); font-size: 15px; font-weight: 800 }
.note { border: 3px dashed var(--ink); border-radius: 18px; padding: 12px 14px; background: var(--yellow-soft); font-size: 15px }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px;
  border-radius: 999px; font-weight: 800; z-index: 50; max-width: calc(100vw - 40px); text-align: center }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; max-width: 100% }
.tabs button { flex: none; min-height: 40px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper);
  font-size: 14px; font-weight: 800; cursor: pointer }
.tabs button[aria-pressed="true"] { background: var(--ink); color: #fff }
.status { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 800 }
.dotgreen { width: 10px; height: 10px; border-radius: 50%; background: #2E9E4F }

.avatar { flex: none; width: 46px; height: 46px; border: 3px solid var(--ink); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 17px; background: var(--blue-soft) }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 2px dashed var(--line) }
.switch small { display: block; color: var(--muted); font-size: 13px }
.switch input { appearance: none; flex: none; width: 52px; height: 30px; border: 3px solid var(--ink); border-radius: 999px; background: #E8E1D3; position: relative; cursor: pointer }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); transition: left .15s }
.switch input:checked { background: var(--green) } .switch input:checked::after { left: 24px }

.choice { display: flex; flex-wrap: wrap; gap: 8px }
.choice label { cursor: pointer }
.choice input { position: absolute; opacity: 0; pointer-events: none }
.choice span { display: inline-flex; min-height: 42px; align-items: center; padding: 0 14px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); font-size: 14px; font-weight: 800 }
.choice input:checked + span { background: var(--ink); color: #fff }
.choice input:focus-visible + span { outline: 3px solid var(--link); outline-offset: 2px }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.stat { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 10px; text-align: center }
.stat b { display: block; font-family: var(--display); font-size: 28px; line-height: 1 }
.tl { display: flex; gap: 12px; align-items: flex-start }
.tl .ic { flex: none; width: 38px; height: 38px; border: 2px solid var(--ink); border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--blue-soft) }
.tl .ic.bad { background: #FFC9BD } .tl .ic.ok { background: var(--green) }
.meter { height: 14px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--blue); transition: width .6s ease }
.meter.trusted i { background: #2E9E4F } .meter.flagged i { background: var(--pink) }

nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--navbg); border-top: 3px solid var(--ink);
  display: flex; justify-content: space-around; padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
nav.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 60px; min-height: 48px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 800 }
nav.tabbar a span { display: flex; padding: 3px 14px; border-radius: 999px }
nav.tabbar a[aria-current="page"] { color: var(--link) } nav.tabbar a[aria-current="page"] span { background: var(--blue-soft) }

dialog.sheet { border: 3px solid var(--ink); border-radius: 28px 28px 0 0; padding: 0; margin: auto auto 0; width: min(480px, 100vw); max-width: 100vw;
  max-height: 88vh; background: var(--ground); color: var(--ink) }
dialog.sheet::backdrop { background: rgba(30, 26, 22, .45) }
dialog.sheet .in { padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px }
.grab { width: 48px; height: 6px; border-radius: 999px; background: var(--ink); margin: 4px auto 0; opacity: .3 }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 2px dashed var(--line); font-size: 15px }
.kv span:first-child { color: var(--muted); flex: none; max-width: 45% } .kv span:last-child { text-align: right; overflow-wrap: anywhere }
.never { display: flex; flex-wrap: wrap; gap: 8px }
.mascot { display: block; margin: 0 auto }
@media (prefers-reduced-motion: reduce) { .meter i, .switch input::after { transition: none } }
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="shell out" id="shell">
  <nav class="sidenav" id="sidenav" aria-label="Main"></nav>
  <main class="app" id="app" aria-live="polite"></main>
  <aside class="rail" id="rail" aria-label="Today"></aside>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
<dialog class="sheet" id="sheet"><div class="in" id="sheetBody"></div></dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = $("#app");
let ME = null, auth = { email: "", code: "", demo: null, inDirectory: false }, filter = "all", busy = false, poll = null;

// ---------------------------------------------------------------- Freebie, the mascot (from the team's design)
function freebie(mood = "wave", size = 180) {
  const h = Math.round(size * 224 / 200);
  const arms = { wave: ['M34 132 L10 92', 'M168 136 L186 170'], cheer: ['M34 128 L12 86', 'M166 128 L188 86'], scan: ['M34 132 L18 168', 'M166 120 L178 86'] }[mood];
  const eyes = mood === "cheer"
    ? '<path d="M68 128 Q78 116 88 128" fill="none" stroke="#1E1A16" stroke-width="6" stroke-linecap="round"/><path d="M112 128 Q122 116 132 128" fill="none" stroke="#1E1A16" stroke-width="6" stroke-linecap="round"/>'
    : '<circle cx="78" cy="128" r="10" fill="#1E1A16"/><circle cx="81" cy="124" r="3.5" fill="#fff"/><circle cx="122" cy="128" r="10" fill="#1E1A16"/><circle cx="125" cy="124" r="3.5" fill="#fff"/>';
  const mouth = mood === "scan" ? '<ellipse cx="100" cy="152" rx="8" ry="7" fill="#7A2E22" stroke="#1E1A16" stroke-width="4"/>'
    : '<path d="M84 145 Q100 170 116 145 Z" fill="#7A2E22" stroke="#1E1A16" stroke-width="4" stroke-linejoin="round"/>';
  const waves = mood === "scan" ? '<circle cx="100" cy="16" r="16" fill="none" stroke="#3366D6" stroke-width="3" opacity=".5"/><circle cx="100" cy="16" r="26" fill="none" stroke="#3366D6" stroke-width="3" opacity=".25"/>' : "";
  const arm = d => `<path d="${d}" stroke="#1E1A16" stroke-width="20" stroke-linecap="round"/><path d="${d}" stroke="#FFD25A" stroke-width="11" stroke-linecap="round"/>`;
  return `<svg class="mascot" role="img" aria-label="Freebie, the Student Agents mascot" width="${size}" height="${h}" viewBox="0 0 200 224">${waves}
    <line x1="100" y1="62" x2="100" y2="24" stroke="#1E1A16" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="18" r="9" fill="#FF7A8A" stroke="#1E1A16" stroke-width="4"/>${arm(arms[0])}${arm(arms[1])}
    <ellipse cx="78" cy="206" rx="18" ry="10" fill="#E0A82E" stroke="#1E1A16" stroke-width="4"/><ellipse cx="122" cy="206" rx="18" ry="10" fill="#E0A82E" stroke="#1E1A16" stroke-width="4"/>
    <path d="M100 58 C 152 58, 180 92, 180 134 C 180 176, 148 200, 100 200 C 52 200, 20 176, 20 134 C 20 92, 48 58, 100 58 Z" fill="#FFD25A" stroke="#1E1A16" stroke-width="5"/>
    <ellipse cx="70" cy="96" rx="20" ry="11" fill="#FFE8A8" transform="rotate(-25 70 96)"/>${eyes}
    <ellipse cx="58" cy="150" rx="11" ry="6.5" fill="#FF9AA8"/><ellipse cx="142" cy="150" rx="11" ry="6.5" fill="#FF9AA8"/>${mouth}</svg>`;
}
const I = {
  radar: '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/></svg>',
  clock: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  shield: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  spark: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#FFD25A" stroke="#1E1A16" stroke-width="1.6"><path d="M12 2 C13 8 16 11 22 12 C16 13 13 16 12 22 C11 16 8 13 2 12 C8 11 11 8 12 2 Z"/></svg>',
  lock: '<svg role="img" aria-label="Locked" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E574B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  mail: '<svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1E1A16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 7.5l9 6 9-6"/></svg>',

// ---------------------------------------------------------------- helpers
async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST", headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body), credentials: "same-origin" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || "Something went wrong. Try again.");
  return j;
}
function toast(text) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = text; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function route() { return (location.hash || "#feed").slice(1).split("?")[0] }
function go(r) { if (location.hash === "#" + r) render(); else location.hash = r }
function first(name) { return String(name || "").split(" ")[0] }
function initials(name) { return String(name || "?").split(" ").map(s => s[0]).slice(0, 2).join("").toUpperCase() }
function sheet(html) { $("#sheetBody").innerHTML = `<div class="grab"></div>${html}`; $("#sheet").showModal() }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet" || e.target.closest("[data-close]")) $("#sheet").close() });
async function run(btn, fn) {
  if (busy) return; busy = true; const old = btn && btn.innerHTML; if (btn) { btn.disabled = true; btn.innerHTML = "One sec…" }
  try { await fn() } catch (e) { toast(e.message) } finally { busy = false; if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old } }
}
async function refresh() { ME = await api("/api/me") }

// ---------------------------------------------------------------- my agent
function describe(m) {
  const t = m.type, f = m.fields || {}, o = m.other, sent = m.direction === "sent";
  const title = f.listing ? `"${f.listing.title}"` : f.event_title ? `"${f.event_title}"` : "";
  if (m.result !== "delivered") return sent ? `Your agent's ${t.toLowerCase().replace(/_/g, " ")} to ${o} was blocked` : `Blocked a message from ${o}'s agent`;
  return ({
    OPPORTUNITY_RELAY: sent ? `Shared ${title} with ${o}` : `Got ${title} from ${o}'s agent`,
    VERIFY_REQUEST: sent ? `Asked ${o}'s agent to check a link` : `${o}'s agent asked you to check ${title}`,
    VERIFY_RESULT: sent ? `Checked a link for ${o}: ${f.status}` : `${o}'s agent checked your link: ${f.status}`,
    AVAILABILITY_QUERY: sent ? `Asked ${o} if they're free for ${title}` : `${o}'s agent asked if you're free for ${title}`,
    AVAILABILITY_REPLY: sent ? `Told ${o} you're "${f.status}"` : `${o} is ${f.status}${f.distance ? ", " + f.distance : ""}`,
    PLAN_INVITE: sent ? `Invited ${o} to ${title}` : `${o} invited you to ${title}`,
    PLAN_REPLY: sent ? `Told ${o}: ${f.answer}` : `${o} said ${f.answer === "accept" ? "yes" : "no"}`,
    PLAN_UPDATE: sent ? `Sent ${o} a plan update: ${f.state}` : `Plan update from ${o}: ${f.state}`,
  })[t] || t;
}

    ${req ? `<section><h2>Friend request</h2><div class="row" style="flex-wrap: nowrap"><span class="avatar" style="background: var(--pink-soft)">${esc(initials(req.name))}</span><div><b>${esc(req.name)}</b><div class="hint">${esc(req.major)} · ${esc(req.year)}</div></div></div>
      <div class="row"><button class="btn small" data-rail="accept" data-o="${esc(req.from)}" type="button">Accept</button><button class="btn small white" data-rail="deny" data-o="${esc(req.from)}" type="button">Deny</button></div></section>` : ""}
    <p class="hint" style="padding: 0 6px">Never shared: your profile, schedule and location.</p>`;
  $("#rail").querySelectorAll("[data-rail]").forEach(b => b.onclick = () => run(b, async () => { await api("/api/friends/" + b.dataset.rail, { other: b.dataset.o }); await refresh(); render() }));
}
async function render() {
  clearInterval(poll);
  try { await refresh() } catch (e) { chrome(false); return offline(e) }
  if (!ME.signed_in) { chrome(false); return signIn() }
  const r = route();
  chrome(true);
  app.classList.add("anim");
  ({ feed, friends, share, squad, agent, sources })[r] ? await ({ feed, friends, share, squad, agent, sources })[r]() : feed();
  rail();
  setTimeout(() => app.classList.remove("anim"), 1200);
  window.scrollTo(0, 0);
  if (r === "feed" || r === "friends" || r === "squad") poll = setInterval(async () => {
    if (busy || $("#sheet").open || document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
    const before = JSON.stringify([ME.feed.length, ME.requests.length, ME.plans]);
    try { await refresh() } catch { return }
    if (JSON.stringify([ME.feed.length, ME.requests.length, ME.plans]) !== before) { ({ feed, friends, squad })[route()]?.(); rail() }
  }, 6000);
}
function offline(e) {
  app.innerHTML = `<div class="stack" style="text-align: center; align-items: center; padding-top: 40px">${freebie("scan", 140)}<h1>Couldn't reach your agent</h1>
    <p class="muted">${esc(e.message)}. Check your connection and try again. Nothing was shared while you were offline.</p><button class="btn" id="retry" type="button">Try again</button></div>`;
  $("#retry").onclick = render;
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
